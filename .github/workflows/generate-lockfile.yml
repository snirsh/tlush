name: Generate bun lockfile

# One-shot helper: run this manually (Actions tab → "Run workflow") to generate
# bun.lock on a runner with public-npm access, when your machine can't reach the
# public registry. Two jobs keep write access away from the install:
#   lockfile  read-only; runs bun install and uploads bun.lock as an artifact.
#   commit    write access; downloads that artifact and commits it back to the
#             branch (dropping the old package-lock.json). Skipped on the default
#             branch, which is protected, so a run there only yields the artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # No ~/.npmrc on the runner, so bun resolves from the public npm registry.
      - run: bun install
      # Always available, even if the commit job is skipped or its push is blocked.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lockfile
          path: bun.lock

  commit:
    needs: lockfile
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bun-lockfile
          path: .
      - name: Commit lockfile back to the branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --quiet --cached --ignore-unmatch package-lock.json
          rm -f package-lock.json
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore: add bun.lock, drop package-lock.json"
            git push
          fi
